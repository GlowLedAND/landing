<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlowLedAND</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    header {
      background: #020617;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 600;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .btn {
      background: #0ea5a3;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .section {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .portfolio {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .portfolio img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
    }

    footer {
      background: #020617;
      color: white;
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div><strong>GlowLedAND</strong></div>
